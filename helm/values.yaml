image: ghcr.io/webis-de/archive-query-log

sourcesBuild:
  replicas: 1

capturesFetch:
  replicas: 1
  # replicas: 25
  size: 1000

capturesImportAql22:
  enabled: false
  dataDir: /mnt/ceph/storage/data-in-progress/data-research/web-search/archive-query-log/focused
  completions: 729  # The number of search providers.
  parallelism: 10
  backoffLimit: 50
  ttlMinutesAfterFinished: 30

serpsParseUrlQuery:
  replicas: 100
  size: 1000

serpsParseUrlPage:
  replicas: 2
  size: 1000

serpsParseUrlOffset:
  replicas: 2
  size: 1000

serpsDownloadWarc:
  replicas: 500
  size: 1000

serpsUploadWarc:
  replicas: 1
  # replicas: 15

serpsParseWarcQuery:
  replicas: 50
  size: 1000

serpsParseWarcOrganicResults:
  replicas: 0
  # replicas: 50
  size: 1000

serpsParseWarcFeatures:
  replicas: 0
  # replicas: 50
  size: 1000

organicResultsFetchCaptures:
  replicas: 1
  size: 1000

organicResultsDownloadWarcBeforeSerp:
  replicas: 500
  size: 1000

organicResultsDownloadWarcAfterSerp:
  replicas: 500
  size: 1000

organicResultsUploadWarc:
  replicas: 1

monitoring:
  ingressClassName: nginx
  host: aql-monitoring.srv.webis.de
  path: /
  replicas: 1
  forceSslRedirect: true

elasticsearch:
  host: elasticsearch.srv.webis.de
  port: 9200
  username: null # Override with `--set elasticsearch.username=EXAMPLE` Helm option.
  password: null # Override with `--set elasticsearch.password=EXAMPLE` Helm option.
  apiKey: null # Override with `--set elasticsearch.apiKey=EXAMPLE` Helm option.
  indexArchives: aql_archives
  indexProviders: aql_providers
  indexSources: aql_sources
  indexCaptures: aql_captures
  indexSerps: aql_serps
  indexOrganicResults: aql_organic_results
  indexFeatures: aql_features

s3:
  endpointUrl: https://s3.dw.webis.de
  bucketName: archive-query-log
  accessKey: null # Override with `--set s3.accessKey=EXAMPLE` Helm option.
  secretKey: null # Override with `--set s3.secretKey=EXAMPLE` Helm option.

warcCache:
  pathSerps: /mnt/ceph/storage/data-in-progress/data-research/web-search/archive-query-log/cache/warc/serps
  pathResults: /mnt/ceph/storage/data-in-progress/data-research/web-search/archive-query-log/cache/warc/results

browser:
  frontend:
    ingressClassName: nginx-external
    host: aql.webis.de
    secondaryHost: aql.web.webis.de
    replicas: 1
    image: ghcr.io/webis-de/archive-query-log/browser
  backend:
    ingressClassName: nginx-external
    host: aql.webis.de
    secondaryHost: aql.web.webis.de
    replicas: 1
    image: ghcr.io/webis-de/archive-query-log

api:
  ingressClassName: nginx-external
  host: aql-api-preview.web.webis.de
  replicas: 1